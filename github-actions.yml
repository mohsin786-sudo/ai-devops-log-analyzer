name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set Up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        cd backend
        pip install -r requirements.txt

    - name: Run Basic Tests
      run: |
        echo "Testing analyzer response..."
        python - << EOF
from app.analyzer import analyze_log
print(analyze_log("ERROR: Build broken"))
EOF
